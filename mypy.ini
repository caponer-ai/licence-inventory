[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
# Not strict mode: the point is to check that the annotations already in the
# code are true, not to annotate every local variable. An unchecked
# annotation is a claim without evidence in a repository that sells evidence.
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = (migrations|\.venv)/

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

[mypy-tests.*]
# Tests lean on pytest fixtures, which are untyped by nature.
ignore_errors = true
