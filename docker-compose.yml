# Підняти сервіс на Postgres однією командою:
#   docker compose up --build
# Далі міграції і демо-дані:
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licence_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: local
      # Відрізняється від .env.example навмисно: там дефолт 0, бо файл
      # копіюють і на прод, а тут compose підіймає саме середовище
      # розробки, де потрібні сторінки помилок Django.
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: licence_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
    ports:
      - "8000:8000"

volumes:
  pgdata:
