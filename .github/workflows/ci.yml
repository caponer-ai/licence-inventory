name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Lint
        run: ruff check .
      - name: Types
        # The annotations are in the code either way; running mypy is what
        # turns them from a claim into a checked one. It found six false
        # annotations the first time it ran.
        run: mypy inventory config
      - name: Production checklist must be clean
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ${{ github.sha }}-ci-only-not-a-real-secret-value
        run: python manage.py check --deploy --fail-level WARNING

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SQLite is the repository default, Postgres is production. On
        # SQLite select_for_update does nothing, so without the second leg
        # the main guarantee against races would never run in CI.
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licence_inventory
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        env:
          POSTGRES_DB: ${{ matrix.database == 'postgres' && 'licence_inventory' || '' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: pytest -q --cov --cov-config=.coveragerc
      - name: Concurrency tests must actually run on Postgres
        if: matrix.database == 'postgres'
        env:
          POSTGRES_DB: licence_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        # A skipped test is a green test. This asserts the concurrency file
        # actually ran here, which is the only place it can: SQLite has no
        # row-level locking, so the same tests are skipped on the other leg.
        # No extra -q here: pytest.ini already passes one, and a second -q
        # suppresses the summary line the grep below looks for. The tests
        # passed and the check still failed, which is its own small lesson
        # about asserting on output you have not actually looked at.
        run: |
          pytest tests/test_concurrency.py --no-cov | tee /tmp/conc.txt
          grep -q "3 passed" /tmp/conc.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The README documents a Docker path with Postgres. Until this job
      # existed the image was never built, and the driver it needs was only
      # in the dev requirements: the documented start was dead on arrival.
      - name: Build and start the documented stack
        run: docker compose up -d --build
      - name: Wait for the service
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Migrations and demo data inside the container
        run: |
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py seed_demo
      - name: The heartbeat really talks to Postgres
        run: |
          curl -fsS http://localhost:8000/healthz/ | tee /tmp/health.json
          grep -q 'database' /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Stop
        if: always()
        run: docker compose down -v
