name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Lint
        run: ruff check .
      - name: Production checklist must be clean
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ${{ github.sha }}-ci-only-not-a-real-secret-value
        run: python manage.py check --deploy --fail-level WARNING

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SQLite is the repository default, Postgres is production. On
        # SQLite select_for_update does nothing, so without the second leg
        # the main guarantee against races would never run in CI.
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licence_inventory
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        env:
          POSTGRES_DB: ${{ matrix.database == 'postgres' && 'licence_inventory' || '' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: pytest -q --cov --cov-config=.coveragerc
